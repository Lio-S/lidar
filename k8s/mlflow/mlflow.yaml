apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts-pvc
  namespace: mlflow
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.22.0
          # L'image officielle n'embarque ni le driver PostgreSQL ni l'exporteur Prometheus
          # → installés au démarrage (local uniquement ; image dédiée si besoin en Phase 6)
          command: ["sh", "-c"]
          args:
            - >-
              pip install --no-cache-dir psycopg2-binary==2.9.13 prometheus-flask-exporter==0.23.2
              && exec mlflow server
              --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
              --default-artifact-root /mlflow/artifacts
              --expose-prometheus /tmp/prometheus
              --host 0.0.0.0
              --port 5000
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /mlflow/artifacts
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500     # accessible via : minikube service mlflow -n mlflow
