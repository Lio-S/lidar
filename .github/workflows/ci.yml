name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.18"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint — ruff check
        run: uv run ruff check .

      - name: Format — ruff format
        run: uv run ruff format --check .

      - name: Type check — mypy
        run: uv run mypy src/

      - name: Tests — pytest
        run: uv run pytest

      # Build avec cache des couches Docker (cache GitHub Actions) :
      # sans cache, chaque run reconstruit apt + uv sync + outils infra (~48 min).
      # Avec cache, seules les couches modifiées sont reconstruites.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build — Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: dev
          tags: archaeo-lidar:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
