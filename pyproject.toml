[project]
name = "archaeo-lidar"
version = "0.1.0"
description = "Automatic detection of archaeological structures from IGN LiDAR HD data"
requires-python = ">=3.12"
dependencies = [
    "laspy[lazrs]==2.7.0",
    "numpy==2.4.6",
    "matplotlib==3.10.9",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.12",
    "mypy==1.16.0",
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "jupyterlab==4.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidar_arch"]

# --- Ruff : lint + format ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line-length géré par le formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy : vérification de types ---
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/lidar_arch --cov-report=term-missing"
